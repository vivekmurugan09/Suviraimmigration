server {
    listen ${PORT};
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ $uri/index.html /index.html;
    }

    location = /Thank-you {
        return 301 /Thank-you/;
    }

    location = /thankyou {
        return 301 /Thank-you/;
    }

    error_page 404 /index.html;
}
